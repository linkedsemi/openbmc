#@TYPE: Machine
#@NAME: raptor
#@DESCRIPTION: Machine configuration for the raptor boards.

LICENSE_FLAGS_ACCEPTED += "xilinx"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'raptor:']['raptor' !='${MACHINE}']}"
#### Regular settings follow

# Yocto device-tree variables
YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "ps7_uart_0"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree = "PS7_DDR_0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
DTC_FLAGS:pn-device-tree ?= "-@"
YAML_DT_BOARD_FLAGS:raptor = "{BOARD template}"

# Yocto linux-xlnx variables
# KERNEL_DEVICETREE is disabled as we use board device tree from DTG to match
# the xsa. User can enable explicitly if required from local.conf.
# KERNEL_DEVICETREE = "zynqmp-zcu102-revA.dtb"
KBUILD_DEFCONFIG = "xilinx_zynq_defconfig"

# Yocto u-boot-xlnx variables
UBOOT_MACHINE ?= "xilinx_zynq_virt_defconfig"
HAS_PLATFORM_INIT:append = " xilinx_zynq_virt_defconfig"

# Yocto FSBL variables
YAML_SERIAL_CONSOLE_STDIN:pn-fsbl-firmware ?= "ps7_uart_0"
YAML_SERIAL_CONSOLE_STDOUT:pn-fsbl-firmware ?= "ps7_uart_0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT  = "0x200000"
UBOOT_LOADADDRESS = "0x200000"
KERNEL_EXTRA_ARGS:zynq += "UIMAGE_LOADADDR=${UBOOT_ENTRYPOINT}"

#Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR = "0x0"
SKIP_APPEND_BASEADDR = "0"

# Serial Console 
YAML_SERIAL_CONSOLE_BAUDRATE = "115200"
### PS console
SERIAL_CONSOLES = "115200;ttyPS0"
### PL console
# SERIAL_CONSOLES = "115200;ttyS0"

SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

# Required generic machine inclusion
require conf/machine/zynq-generic.conf
require conf/machine/include/obmc-bsp-common.inc

KERNEL_IMAGETYPES = " uImage zImage vmlinux"
IMAGE_FSTYPES = " cpio.gz cpio.gz.u-boot"

MACHINE_EXTRA_RRECOMMENDS:append = " kernel-modules"

# VIRTUAL-RUNTIME_obmc-host-state-manager = "x86-power-control"
# VIRTUAL-RUNTIME_obmc-chassis-state-manager = "x86-power-control"

#### No additional settings should be after the Postamble
#### Postamble
# PACKAGE_EXTRA_ARCHS:append = "${@['', 'zynq_generic_7z100']['raptor' != '${MACHINE}']}"

#### root auto login
EXTRA_IMAGE_FEATURES:remove = "debug-tweaks"
IMAGE_FEATURES:remove = "debug-tweaks"
IMAGE_FEATURES:append = " empty-root-password serial-autologin-root"

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lingsi"
BBFILE_PATTERN_meta-lingsi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lingsi = "6"

LAYERDEPENDS_meta-lingsi = "core"
LAYERSERIES_COMPAT_meta-lingsi = " nanbield mickledore gatesgarth hardknott honister langdale"

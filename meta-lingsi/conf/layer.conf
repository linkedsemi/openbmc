# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lingsi-layer"
BBFILE_PATTERN_lingsi-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_lingsi-layer = "6"

LAYERDEPENDS_lingsi-layer = "core"
LAYERSERIES_COMPAT_lingsi-layer = " nanbield mickledore"

#@TYPE: Machine
#@NAME: LinkedSemi LS2010 EVB
#@DESCRIPTION: LinkedSemi LS2010 (riscv64) evaluation board, 128MiB SPI-NOR boot

require conf/machine/include/ls2010-sdk.inc
require conf/machine/include/obmc-bsp-common.inc
# EVB profile: no managed host, so virtual-obmc-system-mgmt is not required.
include conf/machine/include/obmc-evb-common.inc

# This board never runs target binaries on the build host: there is no SDK, no
# qemu boot test and no introspection helper.  Opting out of the default
# qemu-usermode feature keeps qemu-native out of the dependency graph, which
# saves a full qemu build and removes its meson/cmake exe wrappers.
MACHINE_FEATURES_OPTED_OUT += "qemu-usermode"

# gio-module-cache and friends add qemuwrapper-cross to PACKAGE_WRITE_DEPS, which
# pulls in qemu-native.  This board has no qemu on the build host, so drop the
# wrapper: the module caches are generated on the target by the postinst scripts
# instead of at packaging time.
PACKAGE_WRITE_DEPS:remove = "qemuwrapper-cross"
# 128 MiB SPI-NOR, 9 partitions (KiB unless noted)
FLASH_SIZE = "131072"
FLASH_UBOOT_OFFSET:flash-131072 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "2944"
FLASH_KERNEL_OFFSET:flash-131072 = "3072"
FLASH_ROFS_OFFSET:flash-131072 = "13312"
FLASH_RWFS_OFFSET:flash-131072 = "59392"
FLASH_ROFS_BACKUP_OFFSET:flash-131072 = "73728"
FLASH_KERNEL_BACKUP_OFFSET:flash-131072 = "119808"
FLASH_PFM_OFFSET:flash-131072 = "130048"
RWFS_SIZE = "14680064"

UBOOT_MACHINE = "evb_ls2010_defconfig"
UBOOT_DEVICETREE = "evb_ls2010"

KBUILD_DEFCONFIG = "linkedsemi_ls2010_defconfig"
KERNEL_IMAGETYPE = "Image"
# obmc-bsp-common.inc defaults to zImage; RISC-V boots a raw Image
KERNEL_IMAGETYPES = "Image"
KERNEL_DEVICETREE = "linkedsemi/evb_ls2010-linux.dtb"
# phosphor static.mtd expects a FIT blob by default; LS2010 keeps the
# compressed kernel blob produced by the kernel deploy step.
FLASH_KERNEL_IMAGE = "linux.bin"
RISCV_SBI_FDT = "evb_ls2010-linux.dtb"

UBOOT_SIGN_ENABLE = "0"

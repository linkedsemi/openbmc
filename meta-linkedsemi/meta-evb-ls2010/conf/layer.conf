# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "evb-ls2010"
BBFILE_PATTERN_evb-ls2010 := "^${LAYERDIR}/"
BBFILE_PRIORITY_evb-ls2010 = "11"
BBFILE_PATTERN_IGNORE_EMPTY_evb-ls2010 = "1"

LAYERVERSION_evb-ls2010 = "1"
LAYERDEPENDS_evb-ls2010 = "linkedsemi-sdk-layer"
LAYERSERIES_COMPAT_evb-ls2010 = "wrynose"

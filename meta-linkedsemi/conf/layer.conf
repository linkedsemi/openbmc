BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "linkedsemi-sdk-layer"
BBFILE_PATTERN_linkedsemi-sdk-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_linkedsemi-sdk-layer = "10"

LAYERVERSION_linkedsemi-sdk-layer = "1"
LAYERDEPENDS_linkedsemi-sdk-layer = "core"
LAYERSERIES_COMPAT_linkedsemi-sdk-layer = "wrynose"
